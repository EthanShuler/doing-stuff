<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page run under the notch / home indicator;
         AppLayout pads the header and main by env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Home-screen app (PWA). iOS reads the apple-* tags and the 180px
         touch icon, not the manifest's icons. theme-color is colors.pageBg as
         hex (the manifest can't take oklch); the status bar style "default"
         keeps dark status-bar text over the light paper. The PNGs are
         rendered from Newsreader italic on ACCENT — see public/. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fbf5ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="cajubinile" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poster/cover CDNs and the API origin: warm the TLS handshake while
         the JS is still parsing, so the first image/query doesn't pay for it.
         Supabase needs two tags because <img> loads are no-CORS and fetch()
         is CORS — a preconnect only matches a request with the same mode.
         Vite substitutes the env placeholder below at build time; with no
         key configured it resolves to '' and those two tags degrade to a
         harmless same-origin no-op. -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://covers.openlibrary.org" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>cajubinile.com</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
